<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Rock Paper Scissors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">


    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
</head>
<body>
  <div class="container">
    <div id="css" class="nintendo-ds">
      <div class="top-screen">
        <div class="speaker-hole" id="sh1"></div>
        <div class="speaker-hole" id="sh2"></div>
        <div class="screen">
          <div class="screen-content">
            <div id="screen-game" class="screen-game">

              <div id="start-screen" class="start-screen">
                <h1 class="start-title">Rock Paper Scissors</h1>
                <ul class="start-list">
                  <li class="start-option">
                    <span class="start-button choice-y">Y</span>START GAME
                  </li>
                  <li class="start-option">
                    <span class="start-button choice-x">X</span>RULES
                  </li>
                  <li class="start-option">
                    <span class="start-button choice-a">A</span>CREDITS
                  </li>
                </ul>
                <div id="game-version">version 1.0</div>
              </div>
  
              <div id="game-screen" class="game-screen">
                <div class="game-statistics">
                  <div class="player-score">Player Score: <span id="player-score">0</span></div>
                  <div class="computer-score">Computer Score: <span id="computer-score">0</span></div>
                </div>
  
                <div class="game-players">
                  <div class="player-choice game-choice">
                    <img id="player-choice-img" src="./images/unknow-choice.png" alt="">
                  </div>
  
                  <div class="game-versus">
                    <img src="./images/versus-image.png" alt="">
                  </div>
  
                  <div class="computer-choice game-choice">
                    <img id="computer-choice-img" src="./images/unknow-choice.png" alt="">
                  </div>
                </div>
  
                <div class="game-result">
                  <p id="result-text">
                    <span class="result-player">Paper</span> beats
                    <span class="result-computer">Scissors</span>
                  </p>
                </div>
              </div>

            </div>
          </div>
        </div>
        <div class="speaker-hole" id="sh3"></div>
        <div class="speaker-hole" id="sh4"></div>
      </div>
      <div class="hinge">
        <div class="mic"></div>
        <div class="light blink"></div>
      </div>
      <div class="bottom-screen">
        <div class="screen">
          <div class="screen-content">
            <div class="screen-game">


                <div id="bottom-screen-choice" class="bottom-screen-choice">
                  <p class="screen-title-choice">Select your choice:</p>
                  <div class="screen-all-choices">
                    <div class="choices">
                      <img src="./images/paper.png" alt="" />
                      <span class="choices-button choice-y">Y</span>
                    </div>
                    <div class="choices">
                      <img src="./images/rock.png" alt="" />
                      <span class="choices-button choice-x">X</span>
                    </div>
                    <div class="choices">
                      <img src="./images/scissors.png" alt="" />
                      <span class="choices-button choice-a">A</span>
                    </div>
                  </div>
                </div>

            </div>
          </div>
        </div>
        <div class="d-pad">
          <div class="d-pad-marker" id="dpm1"></div>
          <div class="d-pad-marker" id="dpm2"></div>
          <div class="d-pad-marker" id="dpm3"></div>
          <div class="d-pad-marker" id="dpm4"></div>
        </div>
        <div class="button" id="X">X</div>
        <div class="button" id="A">A</div>
        <div class="button" id="B">B</div>
        <div class="button" id="Y">Y</div>
        
        <div id="power-button" class="small-button">
          <ion-icon name="power-outline" role="img" class="md hydrated"></ion-icon>
        </div>
        <div class="small-button" id="select"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
